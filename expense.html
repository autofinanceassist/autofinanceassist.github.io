<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Calculator & Tracker | Auto Finance Assist</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
.chart-card{
    background:white;
    padding:16px;
    border-radius:12px;
    max-width:420px;
    height:320px;
    display:flex;
    align-items:center;
    justify-content:center;
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <h1>Auto Finance Assist</h1>
        <p>For Common Man</p>
    </div>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<!-- INPUT + CHART -->
<section class="section light">
    <h2>Monthly Expense Calculator</h2>
    <p>Track your monthly expenses and understand where your money goes.</p>

    <div class="grid" style="max-width:1000px">

        <!-- INPUT SIDE -->
        <div>

            <div class="card">
                <label>Expense Category</label><br>
                <input type="text" id="category" placeholder="Example: Rent">
            </div>

            <div class="card">
                <label>Amount (₹)</label><br>
                <input type="number" id="amount" placeholder="Example: 15000">
            </div>

            <div class="card">
                <button onclick="addExpense()">Add Expense</button>
            </div>

        </div>

        <!-- CHART SIDE -->
        <div class="chart-card">
            <canvas id="expenseChart" height="260"></canvas>
        </div>

    </div>
</section>

<!-- TABLE -->
<section class="section">
    <h2>Expense Tracker</h2>

    <div style="overflow-x:auto;">
        <table id="expenseTable" border="1" cellpadding="8" cellspacing="0" width="100%">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Category</th>
                    <th>Amount (₹)</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="grid" style="max-width:400px; margin-top:20px;">
        <div class="card">
            <p><strong>Total Monthly Expense</strong></p>
            <h3 id="total">₹ 0</h3>
        </div>
    </div>

    <br>
    <button onclick="downloadExpenseExcel()">Download Excel (CSV)</button>
</section>

<footer>
    <p>© 2026 Auto Finance Assist | Expense Tracker</p>
</footer>

<script>

//////////////////////////////////////////////////
// LOCAL STORAGE (BIG PRO FEATURE)
//////////////////////////////////////////////////

let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

//////////////////////////////////////////////////
// CHART
//////////////////////////////////////////////////

let chart;

function buildChart(){

    const ctx = document.getElementById('expenseChart');

    if(chart) chart.destroy();

    if(expenses.length === 0){
        chart = new Chart(ctx,{
            type:'doughnut',
            data:{
                labels:['No Data'],
                datasets:[{
                    data:[1]
                }]
            },
            options:{
                responsive:true,
                maintainAspectRatio:false,
                plugins:{legend:{display:false}}
            }
        });
        return;
    }

    const categories = expenses.map(e=>e.category);
    const amounts = expenses.map(e=>e.amount);

    chart = new Chart(ctx,{
        type:'doughnut',
        data:{
            labels:categories,
            datasets:[{
                data:amounts
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false
        }
    });
}

//////////////////////////////////////////////////
// ADD EXPENSE
//////////////////////////////////////////////////

function addExpense() {

    const category = document.getElementById("category").value.trim();
    const amount = Number(document.getElementById("amount").value);

    if (!category || amount <= 0) {
        alert("Please enter valid category and amount");
        return;
    }

    expenses.push({ category, amount });

    localStorage.setItem("expenses", JSON.stringify(expenses));

    document.getElementById("category").value = "";
    document.getElementById("amount").value = "";

    renderTable();
}

//////////////////////////////////////////////////
// TABLE
//////////////////////////////////////////////////

function renderTable() {

    const tableBody = document.querySelector("#expenseTable tbody");
    tableBody.innerHTML = "";

    let total = 0;

    expenses.forEach((e, index) => {

        total += e.amount;

        const row = `
            <tr>
                <td>${index + 1}</td>
                <td>${e.category}</td>
                <td>${e.amount.toFixed(2)}</td>
                <td>
                    <button onclick="deleteExpense(${index})">Delete</button>
                </td>
            </tr>
        `;

        tableBody.insertAdjacentHTML("beforeend", row);
    });

    document.getElementById("total").textContent = "₹ " + total.toFixed(2);

    buildChart();
}

//////////////////////////////////////////////////
// DELETE
//////////////////////////////////////////////////

function deleteExpense(index) {

    expenses.splice(index, 1);

    localStorage.setItem("expenses", JSON.stringify(expenses));

    renderTable();
}

//////////////////////////////////////////////////
// CSV DOWNLOAD
//////////////////////////////////////////////////

function downloadExpenseExcel() {

    if (expenses.length === 0) {
        alert("No expenses to download");
        return;
    }

    let csv = "Category,Amount\n";

    expenses.forEach(e => {
        csv += `${e.category},${e.amount}\n`;
    });

    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "Monthly_Expense_Report.csv";
    a.click();

    URL.revokeObjectURL(url);
}

//////////////////////////////////////////////////
// INIT
//////////////////////////////////////////////////

renderTable();

</script>

</body>
</html>
