<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Investment Tracker | Auto Finance Assist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

<header>
  <div>
    <h1>Auto Finance Assist</h1>
    <p>For Common Man</p>
  </div>
  <nav>
    <a href="../index.html">Home</a>
    <a href="#">Investment Tracker</a>
  </nav>
</header>

<section class="section light">
  <h2>Mutual Fund Investment Tracker</h2>
  <p style="text-align:center">
    Track your Mutual Fund investments manually (SIP or Lumpsum)
  </p>

  <div class="grid" style="max-width:900px; margin:auto">

    <div class="card">
      <label>Fund Name</label><br />
      <input type="text" id="fundName" placeholder="Nifty 50 Index Fund" />
    </div>

    <div class="card">
      <label>Investment Type</label><br />
      <select id="investmentType">
        <option value="SIP">SIP</option>
        <option value="Lumpsum">Lumpsum</option>
      </select>
    </div>

    <div class="card">
      <label>Monthly / Invested Amount (₹)</label><br />
      <input type="number" id="amount" placeholder="5000" />
    </div>

    <div class="card">
      <label>Start Date</label><br />
      <input type="date" id="startDate" />
    </div>

    <div class="card">
      <label>Expected Annual Return (%)</label><br />
      <input type="number" id="returnRate" placeholder="12" />
    </div>

    <div class="card">
      <button onclick="addInvestment()">Add Investment</button>
    </div>

  </div>
</section>

<section class="section">
  <h2>My Investments</h2>

  <div style="overflow-x:auto">
    <table border="1" cellpadding="8" cellspacing="0" width="100%" id="investmentTable">
      <thead>
        <tr>
          <th>Fund</th>
          <th>Type</th>
          <th>Amount (₹)</th>
          <th>Start Date</th>
          <th>Return %</th>
          <th>Estimated Value (₹)</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <br />
  <button onclick="exportTrackerCSV()">Download CSV</button>
</section>

<footer>
  <p>© 2026 Auto Finance Assist | Investment Tracker</p>
</footer>

<script>
let investments = JSON.parse(localStorage.getItem("mfTracker")) || [];

function addInvestment() {
  const fund = fundName.value.trim();
  const type = investmentType.value;
  const amount = Number(amountInput.value);
  const start = startDate.value;
  const rate = Number(returnRate.value);

  if (!fund || !amount || !start || !rate) {
    alert("Please fill all fields");
    return;
  }

  const years = (new Date() - new Date(start)) / (1000 * 60 * 60 * 24 * 365);
  if (years <= 0) {
    alert("Start date must be in the past");
    return;
  }

  let estimated;

  if (type === "SIP") {
    const months = years * 12;
    const monthlyRate = rate / 100 / 12;
    estimated = amount * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
  } else {
    estimated = amount * Math.pow(1 + rate / 100, years);
  }

  investments.push({
    fund, type, amount, start, rate,
    estimated: Math.round(estimated)
  });

  localStorage.setItem("mfTracker", JSON.stringify(investments));
  renderTable();
  clearInputs();
}

function renderTable() {
  const tbody = document.querySelector("#investmentTable tbody");
  tbody.innerHTML = "";

  investments.forEach((inv, i) => {
    tbody.innerHTML += `
      <tr>
        <td>${inv.fund}</td>
        <td>${inv.type}</td>
        <td>${inv.amount}</td>
        <td>${inv.start}</td>
        <td>${inv.rate}%</td>
        <td>₹ ${inv.estimated}</td>
        <td><button onclick="removeInvestment(${i})">Remove</button></td>
      </tr>
    `;
  });
}

function removeInvestment(i) {
  investments.splice(i, 1);
  localStorage.setItem("mfTracker", JSON.stringify(investments));
  renderTable();
}

function clearInputs() {
  fundName.value = "";
  amountInput.value = "";
  startDate.value = "";
  returnRate.value = "";
}

function exportTrackerCSV() {
  if (!investments.length) return alert("No data to export");

  let csv = "Fund,Type,Amount,Start Date,Return %,Estimated Value\n";
  investments.forEach(i => {
    csv += `${i.fund},${i.type},${i.amount},${i.start},${i.rate},${i.estimated}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Mutual_Fund_Tracker.csv";
  a.click();
}

renderTable();
</script>

</body>
</html>
