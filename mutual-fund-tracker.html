<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mutual Fund Tracker | Auto Finance Assist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>

<header>
  <div>
    <h1>Auto Finance Assist</h1>
    <p>For Common Man</p>
  </div>
  <nav>
    <a href="../index.html">Home</a>
    <a href="#">Investment Tracker</a>
  </nav>
</header>

<section class="section light">
  <h2>Mutual Fund Investment Tracker</h2>
  <p style="text-align:center">Track your Mutual Fund investments (SIP / Lumpsum)</p>

  <div class="grid" style="max-width:900px; margin:auto">

    <div class="card">
      <label>Fund Name</label><br />
      <input type="text" id="fundName" placeholder="Nifty 50 Index Fund" />
    </div>

    <div class="card">
      <label>Investment Type</label><br />
      <select id="investmentType">
        <option value="SIP">SIP</option>
        <option value="Lumpsum">Lumpsum</option>
      </select>
    </div>

    <div class="card">
      <label>Monthly / Invested Amount (₹)</label><br />
      <input type="number" id="amount" placeholder="5000" />
    </div>

    <div class="card">
      <label>Start Date</label><br />
      <input type="date" id="startDate" />
    </div>

    <div class="card">
      <label>Expected Annual Return (%)</label><br />
      <input type="number" id="returnRate" placeholder="12" />
    </div>

    <div class="card">
      <button onclick="addInvestment()">Add Investment</button>
    </div>

  </div>
</section>

<section class="section">
  <h2>My Investments</h2>

  <div style="overflow-x:auto">
    <table border="1" cellpadding="8" cellspacing="0" width="100%" id="investmentTable">
      <thead>
        <tr>
          <th>Fund</th>
          <th>Type</th>
          <th>Amount (₹)</th>
          <th>Start Date</th>
          <th>Return %</th>
          <th>Estimated Value (₹)</th>
          <th>XIRR %</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <br />
  <button onclick="exportTrackerCSV()">Download CSV</button>
</section>

<footer>
  <p>© 2026 Auto Finance Assist | Mutual Fund Tracker</p>
</footer>

<script>
let investments = JSON.parse(localStorage.getItem("mfTracker")) || [];

/* ---------- XIRR CALCULATION ---------- */
function calculateXIRR(cashflows, dates) {
  let rate = 0.1;
  for (let i = 0; i < 100; i++) {
    let npv = 0, dnpv = 0;
    for (let j = 0; j < cashflows.length; j++) {
      const t = (dates[j] - dates[0]) / (1000 * 60 * 60 * 24 * 365);
      npv += cashflows[j] / Math.pow(1 + rate, t);
      dnpv += -t * cashflows[j] / Math.pow(1 + rate, t + 1);
    }
    const newRate = rate - npv / dnpv;
    if (Math.abs(newRate - rate) < 0.00001) return rate * 100;
    rate = newRate;
  }
  return rate * 100;
}

/* ---------- ADD INVESTMENT ---------- */
function addInvestment() {
  const fund = fundName.value.trim();
  const type = investmentType.value;
  const amount = Number(amount.value);
  const start = new Date(startDate.value);
  const rate = Number(returnRate.value);

  if (!fund || !amount || !start || !rate) {
    alert("Please fill all fields");
    return;
  }

  const today = new Date();
  const years = (today - start) / (1000 * 60 * 60 * 24 * 365);
  if (years <= 0) return alert("Start date must be in the past");

  let estimated, cashflows = [], dates = [];

  if (type === "SIP") {
    const months = Math.floor(years * 12);
    const monthlyRate = rate / 100 / 12;

    for (let i = 0; i < months; i++) {
      cashflows.push(-amount);
      const d = new Date(start);
      d.setMonth(d.getMonth() + i);
      dates.push(d);
    }

    estimated = amount * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
  } else {
    cashflows.push(-amount);
    dates.push(start);
    estimated = amount * Math.pow(1 + rate / 100, years);
  }

  cashflows.push(estimated);
  dates.push(today);

  const xirr = calculateXIRR(cashflows, dates).toFixed(2);

  investments.push({
    fund, type, amount, start: startDate.value,
    rate, estimated: Math.round(estimated), xirr
  });

  localStorage.setItem("mfTracker", JSON.stringify(investments));
  renderTable();
  clearInputs();
}

/* ---------- RENDER TABLE ---------- */
function renderTable() {
  const tbody = investmentTable.querySelector("tbody");
  tbody.innerHTML = "";

  investments.forEach((inv, i) => {
    tbody.innerHTML += `
      <tr>
        <td>${inv.fund}</td>
        <td>${inv.type}</td>
        <td>${inv.amount}</td>
        <td>${inv.start}</td>
        <td>${inv.rate}%</td>
        <td>₹ ${inv.estimated}</td>
        <td>${inv.xirr} %</td>
        <td><button onclick="removeInvestment(${i})">Remove</button></td>
      </tr>`;
  });
}

/* ---------- REMOVE ---------- */
function removeInvestment(i) {
  investments.splice(i, 1);
  localStorage.setItem("mfTracker", JSON.stringify(investments));
  renderTable();
}

/* ---------- CSV ---------- */
function exportTrackerCSV() {
  if (!investments.length) return alert("No data to export");
  let csv = "Fund,Type,Amount,Start Date,Return %,Estimated,XIRR\n";
  investments.forEach(i => {
    csv += `${i.fund},${i.type},${i.amount},${i.start},${i.rate},${i.estimated},${i.xirr}\n`;
  });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "Mutual_Fund_Tracker.csv";
  a.click();
}

/* ---------- CLEAR ---------- */
function clearInputs() {
  fundName.value = amount.value = startDate.value = returnRate.value = "";
}

renderTable();
</script>

</body>
</html>
