<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SPI Mutual Fund Ultra Tracker | Auto Finance Assist</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f6fb;
}

/* HEADER */

header{
background:#1e3a8a;
color:white;
padding:18px;
text-align:center;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
max-width:1100px;
margin:auto;
}

.card{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,.05);
}

button{
background:#2563eb;
color:white;
border:none;
padding:10px;
border-radius:8px;
cursor:pointer;
width:100%;
font-weight:bold;
}

button:hover{
background:#1d4ed8;
}

/* SUMMARY */

.summary{
max-width:1100px;
margin:25px auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.summary div{
background:white;
padding:18px;
border-radius:12px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,.05);
}

/* TABLE */

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

footer{
text-align:center;
padding:20px;
margin-top:40px;
background:#111827;
color:white;
}

</style>
</head>
<body>

<header>
<h1>Auto Finance Assist</h1>
<p>SPI Mutual Fund Ultra Tracker</p>
</header>

<section style="padding:30px">

<h2 style="text-align:center">Add Investment</h2>

<div class="grid">

<div class="card">
<label>Fund Name</label>
<input id="fund" placeholder="Example: Nifty 50" style="width:100%">
</div>

<div class="card">
<label>Type</label>
<select id="type" style="width:100%">
<option>SIP</option>
<option>Lumpsum</option>
</select>
</div>

<div class="card">
<label>Amount (₹)</label>
<input id="amount" type="number" style="width:100%">
</div>

<div class="card">
<label>Start Date</label>
<input id="date" type="date" style="width:100%">
</div>

<div class="card">
<button onclick="addInvestment()">Add Investment</button>
</div>

</div>

</section>

<!-- SUMMARY -->

<div class="summary">

<div>
<h3>Total Invested</h3>
<p id="invested">₹0</p>
</div>

<div>
<h3>Current Value</h3>
<p id="current">₹0</p>
</div>

<div>
<h3>Total Gain</h3>
<p id="gain">₹0</p>
</div>

<div>
<h3>Return %</h3>
<p id="return">0%</p>
</div>

</div>

<section style="max-width:1100px;margin:auto">

<table>
<thead>
<tr>
<th>Fund</th>
<th>Units</th>
<th>Buy NAV</th>
<th>Latest NAV</th>
<th>Invested</th>
<th>Value</th>
<th>Gain</th>
<th>XIRR</th>
<th>Remove</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<br>

<button onclick="downloadTracker()">Download FULL Tracker</button>

</section>

<footer>
© 2026 Auto Finance Assist
</footer>

<script>

let investments = JSON.parse(localStorage.getItem("ultraMF")) || [];
let navData = "";

/* FETCH NAV */

async function fetchNAV(){

const url =
"https://api.allorigins.win/raw?url=https://www.amfiindia.com/spages/NAVAll.txt";

navData = await fetch(url).then(r=>r.text());

updateNAV();
}

/* GET NAV */

function getNAV(name){

const line = navData
.split("\n")
.find(l=>l.toLowerCase().includes(name.toLowerCase()));

if(!line) return null;

return parseFloat(line.split(";")[4]);
}

/* XIRR */

function XIRR(cf,dates){

let rate=.1;

for(let i=0;i<100;i++){

let npv=0;
let d=0;

for(let j=0;j<cf.length;j++){

let t=(dates[j]-dates[0])/(365*24*60*60*1000);

npv+=cf[j]/Math.pow(1+rate,t);
d+=-t*cf[j]/Math.pow(1+rate,t+1);
}

let newRate=rate-npv/d;

if(Math.abs(newRate-rate)<.0001)
return (rate*100).toFixed(2);

rate=newRate;
}

return (rate*100).toFixed(2);
}

/* ADD */

async function addInvestment(){

const fund=document.getElementById("fund").value;
const amount=Number(document.getElementById("amount").value);
const date=new Date(document.getElementById("date").value);

if(!fund||!amount||!date) return alert("Fill all fields");

const nav=getNAV(fund);

if(!nav) return alert("Fund not found in AMFI");

const units=amount/nav;

investments.push({
fund,
units,
buyNav:nav,
amount,
date:date.toISOString()
});

localStorage.setItem("ultraMF",JSON.stringify(investments));

render();
}

/* UPDATE NAV DAILY */

function updateNAV(){

investments.forEach(inv=>{

const latest=getNAV(inv.fund);

if(latest){
inv.latestNav=latest;
inv.value=latest*inv.units;
}
});

localStorage.setItem("ultraMF",JSON.stringify(investments));

render();
}

/* RENDER */

function render(){

let tbody=document.getElementById("table");

tbody.innerHTML="";

let invested=0;
let current=0;

investments.forEach((inv,i)=>{

const gain=(inv.value||0)-inv.amount;

const cf=[-inv.amount,inv.value||inv.amount];
const dates=[new Date(inv.date),new Date()];

const xirr=XIRR(cf,dates);

tbody.innerHTML+=`
<tr>
<td>${inv.fund}</td>
<td>${inv.units.toFixed(2)}</td>
<td>${inv.buyNav.toFixed(2)}</td>
<td>${(inv.latestNav||0).toFixed(2)}</td>
<td>₹${inv.amount}</td>
<td>₹${(inv.value||0).toFixed(0)}</td>
<td style="color:${gain>0?"green":"red"}">
₹${gain.toFixed(0)}
</td>
<td>${xirr}%</td>
<td><button onclick="removeInv(${i})">X</button></td>
</tr>
`;

invested+=inv.amount;
current+=inv.value||0;
});

document.getElementById("invested").innerText="₹"+invested.toFixed(0);
document.getElementById("current").innerText="₹"+current.toFixed(0);
document.getElementById("gain").innerText="₹"+(current-invested).toFixed(0);

document.getElementById("return").innerText=
((current-invested)/invested*100||0).toFixed(2)+"%";
}

/* REMOVE */

function removeInv(i){
investments.splice(i,1);
localStorage.setItem("ultraMF",JSON.stringify(investments));
render();
}

/* DOWNLOAD FULL TRACKER */

function downloadTracker(){

const file=document.documentElement.outerHTML;

const blob=new Blob([file],{type:"text/html"});

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);
a.download="SPI_ULTRA_MF_TRACKER.html";
a.click();
}

/* INIT */

fetchNAV();

</script>

</body>
</html>
