<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RD Calculator | Auto Finance Assist</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        <h1>Auto Finance Assist</h1>
        <p>For Common Man</p>
    </div>
    <nav>
        <a href="index.html">Home</a>
    </nav>
</header>

<section class="section light">
    <h2>Recurring Deposit (RD) Calculator</h2>
    <p>Calculate RD maturity value easily for India & Qatar.</p>

    <div class="grid" style="max-width:600px">

        <div class="card">
            <label>Country</label><br>
            <select id="country">
                <option>India</option>
                <option>Qatar</option>
            </select>
        </div>

        <div class="card">
            <label>Monthly Deposit Amount</label><br>
            <input type="number" id="monthly" placeholder="Example: 5000">
        </div>

        <div class="card">
            <label>Interest Rate (% per year)</label><br>
            <input type="number" id="rate" placeholder="Example: 7">
        </div>

        <div class="card">
            <label>Time Period (Years)</label><br>
            <input type="number" id="years" placeholder="Example: 5">
        </div>

        <div class="card">
            <button onclick="calculateRD()">Calculate RD</button>
        </div>

    </div>
</section>

<section class="section">
    <h2>Result</h2>

    <div class="grid" style="max-width:800px">

        <div class="card">
            <p><strong>Total Investment</strong></p>
            <h3 id="investment">—</h3>
        </div>

        <div class="card">
            <p><strong>Total Interest Earned</strong></p>
            <h3 id="interest">—</h3>
        </div>
